name: daily snapshot
on:
  schedule:
    - cron: "40 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: snapshot
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch raw public data (no API key)
        run: python -m replicated.fetch
      - name: Tests, including the integrity of the new snapshot
        run: python -m unittest discover -s tests
      - name: Re-evaluate the kill conditions and list restated days
        run: python -m replicated.history || echo "::warning::a kill condition fails on the new snapshot"
      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw out/history.md out/history.json
          git diff --cached --quiet || git commit -m "Snapshot $(date -u +%F)"
          git push
